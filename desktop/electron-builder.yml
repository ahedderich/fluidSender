appId: com.fluidsender.desktop
productName: FluidSender
directories:
  output: dist
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
files:
  - src/**/*.js
  - package.json
extraResources:
  - from: vendor/ui-output
    to: ui-output
asarUnpack:
  - resources/ui-output/server/node_modules/@serialport/bindings-cpp/**
linux:
  target:
    - zip
    - AppImage
  category: Utility
mac:
  target:
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
win:
  target: zip
