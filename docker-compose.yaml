# All three services now run as non-root (uid/gid 1000) inside their
# containers — see ui/Dockerfile, fluid-sim/sim/Dockerfile and
# fluid-sim/sim-ui/Dockerfile. If you ran this stack before that change,
# the named volumes below (and ./ui/config, ./fluid-sim/sim-ui/config if
# they exist) may still be root-owned from the old root-user containers;
# run `docker compose down -v` once (or `sudo chown -R 1000:1000` on the
# config dirs) so the new non-root user can write to them.
services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ghcr.io/ahedderich/fluidsender:dev
    volumes:
      - ./ui:/app
      - ./ui/config:/app/config
      - ui_modules:/app/node_modules
      - ui_nuxt:/app/.nuxt
    ports:
      - "3000:3000"
    environment:
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3000"

  sim:
    build:
      context: ./fluid-sim/sim
      dockerfile: Dockerfile
    image: ghcr.io/fluidsender/fluidsender-sim:dev
    ports:
      - "8765:8765"
      - "8766:8766"

  sim-ui:
    build:
      context: ./fluid-sim/sim-ui
      dockerfile: Dockerfile
    image: ghcr.io/fluidsender/fluidsender-sim-ui:dev
    volumes:
      - ./fluid-sim/sim-ui:/app
      - ./fluid-sim/sim-ui/config:/app/config
      - sim_ui_modules:/app/node_modules
      - sim_ui_nuxt:/app/.nuxt
    ports:
      - "3001:3001"
    environment:
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3001"
      SIM_CONTROL_URL: "http://sim:8766"
    depends_on:
      - sim

volumes:
  ui_modules:
  ui_nuxt:
  sim_ui_modules:
  sim_ui_nuxt:
