services:
  fluidsender:
    image: ghcr.io/ahedderich/fluidsender:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    devices:
      # USB-to-serial device for the FluidNC controller. Adjust the path to
      # match your host (e.g. /dev/ttyACM0), or add more lines for multiple
      # machines.
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      NODE_ENV: production
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3000"
      NUXT_JWT_SECRET: "change-this-to-a-long-random-secret"   # required when auth.enabled = true
