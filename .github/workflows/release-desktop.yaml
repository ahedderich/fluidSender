name: Release — Desktop

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
          - os: windows-latest
            artifact-name: windows
          - os: macos-latest
            artifact-name: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Build ui/ and vendor its output
        run: bun run prepare:vendor

      - name: Package
        run: bun run package

      - name: Attach to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.zip dist/*.AppImage; do
            [ -e "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
