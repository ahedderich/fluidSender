[package]
name = "fluidsim"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "FluidNC firmware simulator — TCP server emulating FluidNC WebSocket/serial protocol"

[[bin]]
name = "fluidsim"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum        = { version = "0.8", features = ["ws"] }
tower-http  = { version = "0.6", features = ["cors", "trace"] }
clap        = { version = "4", features = ["derive"] }
tokio-stream = "0.1"
anyhow       = "1"
