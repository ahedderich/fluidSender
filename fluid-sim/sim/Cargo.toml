[package]
name = "fluidsim"
version = "0.1.0"
edition = "2021"
description = "FluidNC firmware simulator — TCP server emulating FluidNC WebSocket/serial protocol"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
